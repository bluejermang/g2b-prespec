<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <title>나라장터 사전규격 알림</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 9h16M4 15h16M10 3v18" stroke="currentColor" stroke-width="2"/></symbol>
  </svg>

  <header class="app-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">📋</span>
        <div>
          <h1>사전규격 알림</h1>
          <p class="updated" id="updated">불러오는 중…</p>
        </div>
      </div>
      <button type="button" class="btn ghost" id="open-conditions">
        <svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>
        <span>수집 조건</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="목록 찾기">
      <div class="period-row">
        <div class="segmented" role="group" aria-label="기간">
          <button type="button" data-period="day" aria-pressed="true">하루</button>
          <button type="button" data-period="7">최근 7일</button>
          <button type="button" data-period="30">최근 30일</button>
          <button type="button" data-period="all">전체</button>
          <button type="button" data-period="custom">직접</button>
        </div>

        <div class="date-stepper" id="day-nav">
          <button type="button" class="icon-btn" id="prev-day" aria-label="이전 목록"><svg class="icon"><use href="#i-left"/></svg></button>
          <select id="day-select" aria-label="목록 날짜"></select>
          <button type="button" class="icon-btn" id="next-day" aria-label="다음 목록"><svg class="icon"><use href="#i-right"/></svg></button>
        </div>

        <div class="date-range" id="custom-range" hidden>
          <select id="from" aria-label="시작 날짜"></select>
          <span class="muted">~</span>
          <select id="to" aria-label="끝 날짜"></select>
        </div>

        <span class="range-label muted" id="range-label" hidden></span>
      </div>

      <label class="search-box">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="q" placeholder="사업명·수요기관 검색" aria-label="사업명 또는 수요기관 검색" enterkeyhint="search">
        <kbd class="kbd" aria-hidden="true">/</kbd>
      </label>

      <div class="filter-row">
        <div class="chips" id="type-chips" role="group" aria-label="업무구분">
          <button type="button" class="chip" data-type="물품" aria-pressed="false">물품</button>
          <button type="button" class="chip" data-type="일반용역" aria-pressed="false">일반용역</button>
          <button type="button" class="chip" data-type="기술용역" aria-pressed="false">기술용역</button>
          <button type="button" class="chip" data-type="공사" aria-pressed="false">공사</button>
          <button type="button" class="chip" data-type="외자" aria-pressed="false">외자</button>
        </div>
        <span class="divider" aria-hidden="true"></span>
        <label class="chip select-chip">
          <span class="sr-only">예산</span>
          <select id="budget-preset" aria-label="예산">
            <option value="">예산 전체</option>
            <option value="5000-">5천만원 이상</option>
            <option value="10000-">1억원 이상</option>
            <option value="30000-">3억원 이상</option>
            <option value="100000-">10억원 이상</option>
            <option value="custom">직접 입력</option>
          </select>
        </label>
        <div class="budget-custom" id="budget-custom" hidden>
          <input type="text" id="budget-min" inputmode="numeric" placeholder="최소" aria-label="예산 최소 (만원)">
          <span class="muted">~</span>
          <input type="text" id="budget-max" inputmode="numeric" placeholder="최대" aria-label="예산 최대 (만원)">
          <span class="muted unit">만원</span>
        </div>
        <button type="button" class="link-btn" id="reset" hidden>필터 초기화</button>
      </div>
    </section>

    <section class="tiles" aria-label="빠른 필터" id="tiles">
      <button type="button" class="tile" data-tile="all" aria-pressed="true">
        <span class="tile-label">전체</span><strong class="tile-value" data-count="all">–</strong>
      </button>
      <button type="button" class="tile ok" data-tile="rfp" aria-pressed="false">
        <span class="tile-label">제안요청서 확보</span><strong class="tile-value" data-count="rfp">–</strong>
      </button>
      <button type="button" class="tile warn" data-tile="check" aria-pressed="false">
        <span class="tile-label">첨부 확인 필요</span><strong class="tile-value" data-count="check">–</strong>
      </button>
      <button type="button" class="tile accent" data-tile="bid" aria-pressed="false">
        <span class="tile-label">본공고 나옴</span><strong class="tile-value" data-count="bid">–</strong>
      </button>
      <button type="button" class="tile danger" data-tile="soon" aria-pressed="false">
        <span class="tile-label">의견마감 3일 내</span><strong class="tile-value" data-count="soon">–</strong>
      </button>
    </section>

    <section class="results-head">
      <label class="check-all">
        <input type="checkbox" id="check-all">
        <span id="result-count">–</span>
      </label>
      <label class="sort">
        <span class="muted">정렬</span>
        <select id="sort">
          <option value="default">번호순</option>
          <option value="budget">예산 높은 순</option>
          <option value="deadline">의견마감 임박 순</option>
        </select>
      </label>
    </section>

    <div id="results" class="results" aria-live="polite"></div>

    <div class="empty" id="empty" hidden>
      <p class="empty-title">조건에 맞는 공고가 없습니다</p>
      <p class="muted">기간을 넓히거나 필터를 줄여 보세요.</p>
      <button type="button" class="btn" id="empty-reset">필터 초기화</button>
    </div>
  </main>

  <div class="action-bar" id="action-bar" role="region" aria-label="복사와 엑셀">
    <div class="action-inner">
      <p class="action-text" id="action-text">–</p>
      <div class="action-buttons">
        <button type="button" class="btn ghost" id="clear-selection" hidden>선택 해제</button>
        <button type="button" class="btn" id="excel-button">
          <svg class="icon" aria-hidden="true"><use href="#i-sheet"/></svg><span>엑셀</span>
        </button>
        <button type="button" class="btn primary" id="copy-button">
          <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span id="copy-label">복사</span>
        </button>
      </div>
    </div>
  </div>

  <dialog class="sheet" id="conditions">
    <div class="sheet-head">
      <h2>수집 조건</h2>
      <button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <p class="muted sheet-desc">매일 아침 이 조건에 맞는 새 사전규격만 목록에 올라옵니다. 조건 변경은 관리자 PC에서 하며 다음 수집부터 적용됩니다.</p>
    <dl class="conditions">
      <dt>키워드</dt><dd id="cond-keywords"></dd>
      <dt>제외어</dt><dd id="cond-exclude"></dd>
      <dt>예산</dt><dd id="cond-budget"></dd>
      <dt>업무구분</dt><dd id="cond-types"></dd>
    </dl>
    <h3 class="sheet-sub">복사 형식</h3>
    <p class="copy-sample">수요기관명 - <u>사업명 (예산)</u> -&gt; 본공고</p>
    <p class="muted small">사업명에 나라장터 링크가 걸린 채 복사되어 업무시스템에 그대로 붙여넣을 수 있습니다.</p>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/search.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
